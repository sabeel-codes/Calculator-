<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" readonly />

      <div class="buttons">
        <!-- Buttons yahan banayenge -->
        <button id = "btnC">C</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button id = "btn-div">/</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button id = "btn-mul">*</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button id = "btn-minus">-</button>
        <button>0</button>
        <button>.</button>
        <button id = "btn-eql">=</button>
        <button id = "btn-add">+</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
